  <script>
const fechaInicio = new Date("2025-08-16");

function actualizarContador() {
    const ahora = new Date();
    const diferencia = ahora - fechaInicio;

    const dias = Math.floor(diferencia / (1000 * 60 * 60 * 24));
    const horas = Math.floor((diferencia / (1000 * 60 * 60)) % 24);
    const minutos = Math.floor((diferencia / (1000 * 60)) % 60);
    const segundos = Math.floor((diferencia / 1000) % 60);

    document.getElementById("contador").innerHTML =
        `${dias} días, ${horas} horas, ${minutos} minutos y ${segundos} segundos 🤎`;
}   
setInterval(actualizarContador, 1000);
actualizarContador();
</script>  

<script>
const paginas = document.querySelectorAll(".pagina");
let actual = 0;

paginas.forEach((pagina, i) => {
    pagina.style.zIndex = paginas.length - i;
});

document.querySelector(".libreta").addEventListener("click", () => {

    if (actual < paginas.length) {

        paginas[actual].style.transform = "rotateY(-180deg)";
        paginas[actual].style.zIndex = actual;

        actual++;
    }

});
</script>
